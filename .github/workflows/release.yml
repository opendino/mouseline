name: Release

# Pushing a tag like v0.1.0 builds the DMG and publishes a GitHub release with it.
# The tag must match CFBundleShortVersionString in Support/Info.plist, and CHANGELOG.md
# must have a "## <version>" section, which becomes the release notes.
#
# Signing: with the RELEASE_SIGNING_P12 and RELEASE_SIGNING_P12_PASSWORD secrets
# (scripts/make-release-cert.sh --set-secrets) the app is signed with the project's fixed
# self-signed certificate, so the Accessibility permission survives updates. Without them
# it is signed ad hoc (forks). Either way users see a Gatekeeper warning when they open a
# downloaded DMG; Developer ID signing and notarization can be added later with secrets
# for the certificate and an App Store Connect API key (see README → Releasing).
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: it builds and signs the
# DMG and attaches it to the run as an artifact, without publishing anything.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Check the version
        id: version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          if [[ "$GITHUB_REF_TYPE" == tag && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: scripts/test.sh

      - name: Import the release signing certificate
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_SIGNING_P12" ]]; then
            echo "::warning::RELEASE_SIGNING_P12 is not set; signing ad hoc, so users lose the Accessibility permission on every update"
            exit 0
          fi
          echo "SIGN_IDENTITY=$(scripts/import-release-cert.sh)" >> "$GITHUB_ENV"

      - name: Build the DMG
        run: scripts/make-release.sh

      - name: Check the signature
        run: |
          codesign --verify --strict --verbose=1 build/MouseLine.app
          codesign -d -r- build/MouseLine.app 2>&1 | grep '^designated'

      - name: Keep the DMG (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: MouseLine-${{ steps.version.outputs.version }}-dry-run
          path: dist/MouseLine-${{ steps.version.outputs.version }}.dmg

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          dmg="dist/MouseLine-${{ steps.version.outputs.version }}.dmg"
          {
            echo
            echo "**SHA-256** \`$(shasum -a 256 "$dmg" | awk '{ print $1 }')\` \`$(basename "$dmg")\`"
          } >> notes.md
          cat notes.md

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/MouseLine-${{ steps.version.outputs.version }}.dmg" \
            --title "MouseLine ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
